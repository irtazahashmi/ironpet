name: IronPetRemote
options:
  bundleIdPrefix: dev.ironpet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode manages the profiles for this team. CI signs simulator builds ad hoc (CODE_SIGN_IDENTITY=-) so it needs no account;
    # unsigned builds can't use the Keychain.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HQWC8SCC63
packages:
  IronPetKit:
    path: ..
targets:
  IronPetRemote:
    type: application
    platform: iOS
    sources: [IronPetRemote]
    dependencies:
      - package: IronPetKit
        product: IronPetKit
      - target: IronPetWidget
        embed: true
    # Mermaid diagrams in the chat: the Mac's mermaid.html plus the pinned mermaid.js that scripts/fetch_mermaid.sh downloads
    # (checked against its SHA-256) go into the app's resources. Offline the script copies nothing and diagrams show as code.
    preBuildScripts:
      - name: Bundle Mermaid
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dest"
          rm -f "$dest/mermaid.html" "$dest/mermaid.min.js"
          js=$("$SRCROOT/../scripts/fetch_mermaid.sh") || js=""
          if [ -n "$js" ]; then
            cp "$js" "$dest/mermaid.min.js"
            cp "$SRCROOT/../Resources/mermaid.html" "$dest/mermaid.html"
          fi
    entitlements:
      path: IronPetRemote/IronPetRemote.entitlements
    info:
      path: IronPetRemote/Info.plist
      properties:
        CFBundleDisplayName: IronPet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: IronPet scans the pairing QR code that your Mac shows.
        NSMicrophoneUsageDescription: IronPet records what you say and sends it to your Mac, which turns it into text.
        NSLocalNetworkUsageDescription: IronPet talks to the IronPet app on your Mac over your local network.
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only the system's TLS and SHA-256 hashes, which are exempt, so TestFlight doesn't ask about export compliance on every build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ironpet.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # The Bundle Mermaid phase downloads a file and writes into the app, which the script sandbox forbids.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  IronPetWidget:
    type: app-extension
    platform: iOS
    sources:
      - IronPetWidget
      # Same ActivityAttributes type the app uses to start Live Activities.
      - IronPetRemote/PetActivityAttributes.swift
    dependencies:
      - package: IronPetKit
        product: IronPetKit
    entitlements:
      path: IronPetWidget/IronPetWidget.entitlements
    info:
      path: IronPetWidget/Info.plist
      properties:
        CFBundleDisplayName: IronPet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ironpet.app.widget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  IronPetRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IronPetRemoteTests
      - ../Tests/IronPetKitTests/Support/MockIronPetServer.swift
      - ../Tests/IronPetKitTests/Support/TestSheets.swift
    dependencies:
      - target: IronPetRemote
      - package: IronPetKit
        product: IronPetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ironpet.app.tests
        GENERATE_INFOPLIST_FILE: YES
  IronPetRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IronPetRemoteUITests
      - ../Tests/IronPetKitTests/Support/MockIronPetServer.swift
      - ../Tests/IronPetKitTests/Support/TestSheets.swift
    dependencies:
      - target: IronPetRemote
      - package: IronPetKit
        product: IronPetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ironpet.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IronPetRemote:
    build:
      targets:
        IronPetRemote: all
        IronPetWidget: all
    test:
      targets:
        - IronPetRemoteTests
        - IronPetRemoteUITests
