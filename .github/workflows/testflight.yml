name: TestFlight

# Archives IronPet Remote (the iPhone app and its widget) and uploads it to TestFlight. Run it from the Actions tab on main;
# the run waits for one of the required reviewers of the `testflight` environment, then builds with scripts/ios_testflight.sh.
#
# It signs with Apple's cloud-managed signing through an App Store Connect API key, so there is no certificate or provisioning
# profile to store. Three secrets, in the `testflight` environment and NOT as repository secrets (a repository secret would
# reach any workflow a writer pushes on any branch):
#   ASC_KEY_P8     base64 of the App Store Connect API key (.p8), a key made for iOS with a role that allows cloud signing
#   ASC_KEY_ID     that key's ID
#   ASC_ISSUER_ID  the issuer ID shown above the keys in App Store Connect
# The environment admits only main and has required reviewers; CONTRIBUTING.md > iOS app has the setup. It never runs for
# pull requests, tags or pushes. The actions are pinned to commits because this job holds the key; ci.yml, which holds no
# secrets, uses tags. The job has a read-only token and cannot write to the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

# One upload at a time. A second request waits instead of cancelling an upload that is already running.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    steps:
      # The environment limits this too; this stops a copy of the workflow on another branch from going further.
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "error: run this workflow from main, not from $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # nothing later needs the token, so it must not sit in .git/config

      # App Store Connect only takes builds from a recent SDK, and the runner's default Xcode (16.4) is too old for that.
      - name: Select Xcode 26.3
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      # The same pinned and checksum-verified XcodeGen as ci.yml.
      - name: Install XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/xcodegen"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Archive and upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_P8:?add ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID to the testflight environment (CONTRIBUTING.md > iOS app)}"
          export ASC_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          ( umask 077; printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_FILE" )
          unset ASC_KEY_P8 # the build below needs the key file, not a second copy in its environment
          # The UTC time, as ios_testflight.sh does by default, so every upload stays above the ones before it.
          build=$(date -u +%Y%m%d%H%M)
          ./scripts/ios_testflight.sh "$build"
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' iOS/project.yml | sed -n 1p)
          {
            echo "### Uploaded to TestFlight"
            echo "Version \`$version\`, build \`$build\`, from \`${GITHUB_SHA:0:7}\`. It appears in TestFlight once App Store Connect finishes processing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
