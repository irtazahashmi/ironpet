name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          swift --version
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Dependencies only change with Package.resolved, so the key leaves out the sources: ironpet's own files are
      # rebuilt every run because checkout gives them new mtimes.
      - name: Cache the debug build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      # A test that crashes the process (a signal, not an assertion) leaves only "unexpected signal code" in the log.
      - name: Crash reports
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*xctest* /Library/Logs/DiagnosticReports/*xctest* 2>/dev/null | head -3); do
            echo "== $f"
            head -c 100000 "$f"
            echo
          done

  bundle:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          swift --version
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache the release build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Bundle the app (ad-hoc signed, includes the generated sprite sheet)
        run: |
          ./scripts/bundle.sh
          test -f build/IronPet.app/Contents/Resources/spritesheet.png
          codesign --verify --verbose build/IronPet.app
          ./scripts/check_adapters.sh build/IronPet.app

      - name: TEMP size diagnostic (remove before merge)
        if: always()
        run: |
          show() { ls -l "$1" | awk '{print "bytes:", $5}'; size -m "$1" | grep -E "^Segment|Section __text"; }
          echo "== branch"; show build/IronPet.app/Contents/MacOS/IronPet
          git fetch --depth=1 origin main
          git worktree add ../main-wt FETCH_HEAD
          cd ../main-wt && git log --oneline -1 && swift build -c release
          echo "== main"; show "$(swift build -c release --show-bin-path)/IronPet"

      - name: Check scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/e2e.py scripts/gen_agent_catalog.py

  # IronPet Remote for iOS, on a simulator. It is not part of the "build" gate below until it has run green on a GitHub runner.
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/xcodegen"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        working-directory: iOS
        run: xcodegen generate

      - name: Unit and UI tests
        run: |
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test -project iOS/IronPetRemote.xcodeproj -scheme IronPetRemote \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$RUNNER_TEMP/dd"

  # Branch protection requires a check named "build"; it passes only when both jobs above do.
  build:
    needs: [test, bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tests and bundle passed
        run: |
          echo "test: ${{ needs.test.result }}, bundle: ${{ needs.bundle.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.bundle.result }}" = success
