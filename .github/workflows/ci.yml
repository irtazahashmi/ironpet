name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a PR branch cancels that PR's older run. Every push to main gets its own group and always runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which expensive jobs this change needs. Push to main always runs everything.
  # Docs-only PRs (README, SPEC, SECURITY, …) skip Mac and iOS runners; `build` still
  # reports success so branch protection stays green.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
      ios: ${{ steps.filter.outputs.ios }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            echo "push to main: run every job"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACDMR "$base...$head")
          printf 'changed (%d):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          mac=false
          ios=false
          scripts=false
          unknown=false

          is_docs() {
            case "$1" in
              *.md|LICENSE|docs|docs/*|.agents|.agents/*|.cursor|.cursor/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_mac() {
            case "$1" in
              Sources/*|Tests/*|Package.swift|Package.resolved|Resources/*|tools/*|sidecar/*|Vendor/*) return 0 ;;
              scripts/bundle.sh|scripts/check_adapters.sh|scripts/gen_agent_catalog.py|scripts/gen_skills.py|scripts/screenshots.sh|scripts/make_signing_identity.sh) return 0 ;;
              skills|skills/*) return 0 ;; # compiled into the app
              .github/*) return 0 ;;       # workflow changes must re-run Mac gates
              *) return 1 ;;
            esac
          }

          is_ios() {
            case "$1" in
              iOS/*|Sources/IronPetKit/*|Tests/IronPetKitTests/*|scripts/ios_ui_shards.py) return 0 ;;
              Package.swift|Package.resolved|.github/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_scripts() {
            case "$1" in
              scripts/*|.github/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          for f in "${files[@]}"; do
            if is_mac "$f"; then mac=true; fi
            if is_ios "$f"; then ios=true; fi
            if is_scripts "$f"; then scripts=true; fi
            if ! is_docs "$f" && ! is_mac "$f" && ! is_ios "$f" && ! is_scripts "$f"; then
              unknown=true
            fi
          done

          # Unclassified paths (e.g. a new top-level file): run everything rather than skip.
          if [ "$unknown" = true ]; then
            mac=true
            ios=true
            scripts=true
            echo "unclassified path present: run every job"
          fi

          # Mac bundle already runs the script syntax checks.
          if [ "$mac" = true ]; then
            scripts=false
          fi

          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "filter: mac=$mac ios=$ios scripts=$scripts"

  test:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          swift --version
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Dependencies only change with Package.resolved, so the key leaves out the sources: ironpet's own files are
      # rebuilt every run because checkout gives them new mtimes.
      - name: Cache the debug build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      # A test that crashes the process (a signal, not an assertion) leaves only "unexpected signal code" in the log.
      - name: Crash reports
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*xctest* /Library/Logs/DiagnosticReports/*xctest* 2>/dev/null | head -3); do
            echo "== $f"
            head -c 100000 "$f"
            echo
          done

  bundle:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        run: |
          sw_vers
          swift --version
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache the release build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Bundle the app (ad-hoc signed, includes the generated sprite sheet)
        run: |
          ./scripts/bundle.sh
          test -f build/IronPet.app/Contents/Resources/spritesheet.png
          codesign --verify --verbose build/IronPet.app
          ./scripts/check_adapters.sh build/IronPet.app

      - name: Check scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/e2e.py scripts/gen_agent_catalog.py scripts/ios_ui_shards.py

  # Script syntax only, when scripts/ changed without a Mac rebuild (e.g. e2e.py).
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/e2e.py scripts/gen_agent_catalog.py scripts/ios_ui_shards.py

  # IronPet Remote for iOS, on a simulator. ios-build compiles the app and the test bundles once and uploads them.
  # ios-unit and the four ios-ui shards download that build and run it with test-without-building.
  # The shard lists live in scripts/ios_ui_shards.py. Each class runs in exactly one job.
  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Every UI test class is in a shard
        run: python3 scripts/ios_ui_shards.py check

      - name: Install XcodeGen
        run: |
          mkdir -p "$RUNNER_TEMP/xcodegen"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip
          echo "a4847ed77d3341a4d24049bc4424a3babca4c94ff1dcaaee923eaca2b32c678f  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        working-directory: iOS
        run: xcodegen generate

      - name: Build for testing
        run: |
          xcodebuild build-for-testing -project iOS/IronPetRemote.xcodeproj -scheme IronPetRemote \
            -destination 'generic/platform=iOS Simulator' -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=-

      # ditto keeps symlinks and the executable bit. The .xctestrun finds its products through __TESTROOT__, so it stays
      # next to Debug-iphonesimulator inside the zip.
      - name: Zip the products
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/dd/Build/Products"
          ls "$products"
          compgen -G "$products/*.xctestrun"
          test -d "$products/Debug-iphonesimulator"
          ditto -c -k "$products" "$RUNNER_TEMP/ios-products.zip"
          du -sh "$RUNNER_TEMP/ios-products.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}/ios-products.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  ios-unit:
    needs: [changes, ios-build]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}/artifact

      - name: Unit tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/products"
          ditto -x -k "$RUNNER_TEMP/artifact/ios-products.zip" "$RUNNER_TEMP/products"
          xctestrun=$(find "$RUNNER_TEMP/products" -maxdepth 1 -name '*.xctestrun')
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$device" \
            -only-testing:IronPetRemoteTests

  ios-ui:
    needs: [changes, ios-build]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The checkout is only for scripts/ios_ui_shards.py, which holds the shard lists.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: ios-products
          path: ${{ runner.temp }}/artifact

      - name: UI tests, shard ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/products"
          ditto -x -k "$RUNNER_TEMP/artifact/ios-products.zip" "$RUNNER_TEMP/products"
          xctestrun=$(find "$RUNNER_TEMP/products" -maxdepth 1 -name '*.xctestrun')
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          read -ra tests <<< "$(python3 scripts/ios_ui_shards.py args ${{ matrix.shard }})"
          xcodebuild test-without-building -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$device" \
            "${tests[@]}"

  # IronPetCore on Linux. It is non-blocking for now (continue-on-error), and the "build" gate below does not wait for it.
  linux:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install SQLite headers and unzip
        run: apt-get update && apt-get install -y libsqlite3-dev pkg-config unzip

      # The key leaves out the sources for the same reason as the macOS jobs. The resolved checkouts live inside .build.
      - name: Cache the build and the resolved checkouts
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-${{ runner.os }}-swift-6.1-noble-${{ hashFiles('Package.resolved', 'Package.swift') }}

      - name: Build the core
        run: swift build --target IronPetCore

      - name: Core tests
        run: swift test --filter IronPetCoreTests

  # Branch protection requires a check named "build". Skipped Mac and iOS jobs count as OK for docs-only PRs.
  build:
    needs: [changes, test, bundle, scripts, ios-build, ios-unit, ios-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required gates passed or correctly skipped
        run: |
          set -euo pipefail
          changes_r="${{ needs.changes.result }}"
          mac="${{ needs.changes.outputs.mac }}"
          scripts="${{ needs.changes.outputs.scripts }}"
          ios="${{ needs.changes.outputs.ios }}"
          test_r="${{ needs.test.result }}"
          bundle_r="${{ needs.bundle.result }}"
          scripts_r="${{ needs.scripts.result }}"
          ios_build_r="${{ needs.ios-build.result }}"
          ios_unit_r="${{ needs.ios-unit.result }}"
          ios_ui_r="${{ needs.ios-ui.result }}"
          echo "changes=$changes_r mac=$mac scripts=$scripts ios=$ios"
          echo "test=$test_r bundle=$bundle_r scripts_job=$scripts_r ios_build=$ios_build_r ios_unit=$ios_unit_r ios_ui=$ios_ui_r"

          [ "$changes_r" = success ]

          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }

          if [ "$mac" = true ]; then
            [ "$test_r" = success ] && [ "$bundle_r" = success ]
          else
            ok "$test_r" && ok "$bundle_r"
          fi

          if [ "$scripts" = true ]; then
            [ "$scripts_r" = success ]
          else
            ok "$scripts_r"
          fi

          if [ "$ios" = true ]; then
            [ "$ios_build_r" = success ] && [ "$ios_unit_r" = success ] && [ "$ios_ui_r" = success ]
          else
            ok "$ios_build_r" && ok "$ios_unit_r" && ok "$ios_ui_r"
          fi
